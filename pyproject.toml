[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "3x3_timer"
version = "2.3"
description = "A modern desktop timer for 3×3 Rubik's Cube solves with CustomTkinter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
3x3_timer = "ui:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PTH", "PL"]
ignore = [
    "N806",    # Allow uppercase variable names (e.g. cube face notation U, D, F, B, L, R)
    "PLR2004", # Allow magic values in comparisons (tests and UI constants are fine)
    "PLR0915", # Allow long functions (UI methods are inherently long)
    "ARG002",  # Allow unused method arguments (e.g. event handlers)
    "ARG005",  # Allow unused lambda arguments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]