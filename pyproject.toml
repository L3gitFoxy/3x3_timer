[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "3x3_timer"
version = "2.3"
description = "A modern desktop timer for 3×3 Rubik's Cube solves with CustomTkinter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
3x3_timer = "ui:main"
